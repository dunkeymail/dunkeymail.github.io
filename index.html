<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
  />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#4f9d84" />
  <title>Check-In Mockup</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <section id="scanner-screen" class="screen active">
      <button class="icon-btn close-btn" type="button" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18"></path>
        </svg>
      </button>

      <div class="scanner-header">
        <h1>Ready to check in?</h1>
        <p>Just scan the venue's QR code with your camera.</p>
      </div>

      <div class="scanner-shell">
        <div id="reader"></div>
        <div class="scan-frame"></div>
      </div>

      <div class="scanner-footer">
        <button id="start-btn" class="camera-btn" type="button" aria-label="Start camera">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 7l1.8-2h4.4L16 7h2a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h2z"></path>
            <circle cx="12" cy="12.5" r="3.2"></circle>
          </svg>
        </button>
        <div id="status" aria-live="polite"></div>
      </div>
    </section>

    <section id="loading-screen" class="screen">
      <div class="loading-panel">
        <div class="loading-spinner"></div>
        <p>Checking you in ...</p>
      </div>
    </section>

    <section id="success-screen" class="screen success">
      <div class="success-header">
        <button class="icon-btn top-left-btn" type="button" aria-label="Close">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M6 6l12 12M18 6L6 18"></path>
          </svg>
        </button>

        <div class="header-actions">
          <button class="icon-btn" type="button" aria-label="Info">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle>
              <path d="M12 10v6"></path>
              <circle cx="12" cy="7.3" r="0.8" fill="currentColor" stroke="none"></circle>
            </svg>
          </button>
          <button class="icon-btn" type="button" aria-label="Share">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="18" cy="5" r="2"></circle>
              <circle cx="6" cy="12" r="2"></circle>
              <circle cx="18" cy="19" r="2"></circle>
              <path d="M8 12l8-6"></path>
              <path d="M8 12l8 6"></path>
            </svg>
          </button>
        </div>

        <div class="avatar-wrap">
          <svg class="avatar-ring" viewBox="0 0 180 180" aria-hidden="true">
            <circle
              cx="90"
              cy="90"
              r="67"
              fill="none"
              stroke="rgba(255,255,255,0.85)"
              stroke-width="4"
              stroke-linecap="round"
              stroke-dasharray="2 11"
            />
            <path
              d="M36 88a54 54 0 0 1 108 0"
              fill="none"
              stroke="rgba(255,255,255,0.95)"
              stroke-width="4"
              stroke-linecap="round"
              stroke-dasharray="1 13"
            />
          </svg>
          <div class="avatar-disc"></div>
          <img id="profile-image" src="profile.jpg" alt="Profile image" />
        </div>
      </div>

      <div class="success-card">
        <div class="identity-block">
          <h2 id="profile-name">
            John Doe <span class="inline-id">• 183629837</span>
          </h2>
          <div class="success-text">Check-in: Successful</div>
        </div>

        <div class="details">
          <div class="row">
            <div class="row-left">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 21s-6-5.3-6-11a6 6 0 1 1 12 0c0 5.7-6 11-6 11z"></path>
                <circle cx="12" cy="10" r="2.1"></circle>
              </svg>
              <span class="label">Venue</span>
            </div>
            <span class="value" id="venue-value">Fenriz Gym</span>
          </div>

          <div class="row">
            <div class="row-left">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M8.5 7h7l1 3.5-1.8 2V18H9.3v-5.5L7.5 10.5 8.5 7z"></path>
                <path d="M10 7V5.7A2 2 0 0 1 12 4a2 2 0 0 1 2 1.7V7"></path>
              </svg>
              <span class="label">Activity</span>
            </div>
            <span class="value" id="activity-value">Boxing</span>
          </div>

          <div class="row">
            <div class="row-left">
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="8.5"></circle>
                <path d="M12 7.5v4.8l3 2"></path>
              </svg>
              <span class="label">Checked in at</span>
            </div>
            <span class="value" id="time-value">Jul 25, 1:48 PM · 01:42</span>
          </div>
        </div>

        <button id="reset-btn" class="reset-btn" type="button">Scan another code</button>
      </div>
    </section>
  </div>

  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <script src="app.js"></script>
</body>
</html>
